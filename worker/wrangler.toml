name = "minco-demo"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
# модель на OpenRouter (https://openrouter.ai/models)
MODEL = "openai/gpt-5-mini"
# адрес страницы на GitHub Pages (через запятую, если несколько)
ALLOWED_ORIGINS = "https://komapc.github.io,https://minco.lipu.dev"
# не более стольких вызовов модели в сутки (UTC) на всех — потолок расходов (класс DailyCap в index.js)
DAILY_LIMIT = "1000"

# не более 10 запросов в минуту с одного адреса
[[unsafe.bindings]]
name = "LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# не более 30 запросов в минуту со всех адресов: потолок расходов, если обойдут лимит на адрес
[[unsafe.bindings]]
name = "GLOBAL_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# суточный счётчик вызовов модели — один Durable Object на весь мир (ratelimit выше считает по точкам Cloudflare)
# создаётся сам при `wrangler deploy`, отдельной команды не нужно
[[durable_objects.bindings]]
name = "DAILY_CAP"
class_name = "DailyCap"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DailyCap"]
