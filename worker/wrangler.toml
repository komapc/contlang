name = "minco-demo"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
# модель на OpenRouter (https://openrouter.ai/models)
MODEL = "openai/gpt-4o-mini"
# адрес страницы на GitHub Pages (через запятую, если несколько)
ALLOWED_ORIGINS = "https://komapc.github.io"

# не более 10 запросов в минуту с одного адреса
[[unsafe.bindings]]
name = "LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
