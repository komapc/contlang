# Фонетика min-co (опция сайта «Фонетика»). Источник правды о звучании; из него
# `python3 scripts/site/build.py` строит site/data/phonetics.json. Черновик: на слух не проверялся.
#
# Слот = корень + значение оси. Корень — один слог. Знак значения — в начальном согласном:
# глухой = положительный полюс, звонкий = отрицательный, сонорный = нейтральная форма («не указано»);
# явный (=0) — нейтральная форма + «ain» (loain). Величина — число повторов слога (|v|, нейтральная — один раз).
# Слово = блоки корней через «-», затем «'» и гласная части речи, затем роль и метки через «·».
#
# families: тройки согласных [глухой, звонкий, нейтральный]; roots: положительная форма слога.
# У корней без оси звучит только нейтральная форма (SEE → lu, PLACE → ma, TEXT → li).
families:
  - [p, b, l]
  - [t, d, m]
  - [k, g, n]
  - [s, z, j]
  - [f, v, w]
# Метки формы: гласная + согласный; тройки [положительная, отрицательная, нейтральная] — коды слогов
# [at, ad, an]: знак метки — звонкость конечного согласного, нейтральная — сонорный.
coda_families:
  - [t, d, n]
  - [k, g, m]
  - [s, z, r]
