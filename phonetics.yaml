# Фонетика min-co (опция сайта «Фонетика»). Источник правды о звучании; из него
# `python3 scripts/site/build.py` строит site/data/phonetics.json. Черновик: на слух не проверялся.
#
# Корень — токипонское слово целиком (1–3 слога), где оно подходит по смыслу; корни без токипонской
# пары можно заменять (см. docs/phonology.md). Знак значения — в первом согласном слова: глухой
# (p t k s f) — положительный полюс, звонкий (b d g z v) — отрицательный, сонорный (l m n j w) —
# нейтральная форма («не указано»). Явный (=0) — нейтральная форма + «y» (ы: lonay).
# Величина — число повторов всего слова (|v|, нейтральная — один раз). Слово = блоки корней через «-»,
# затем «'» и гласная части речи, затем роль и метки через «·».
#
# families: тройки согласных [глухой, звонкий, нейтральный]; roots: токипонское слово, в котором
# первый согласный стоит в своей семье (форма слова в таблице — как в токипонском; остальные две
# получаются заменой первого согласного). У корней без оси звучит только само слово.
families:
  - [p, b, l]
  - [t, d, m]
  - [k, g, n]
  - [s, z, j]
  - [f, v, w]
# Метки формы: гласная + согласный; тройки [положительная, отрицательная, нейтральная]:
# [at, ad, an]: знак метки — звонкость конечного согласного, нейтральная — сонорный.
coda_families:
  - [t, d, n]
  - [k, g, m]
  - [s, z, r]
