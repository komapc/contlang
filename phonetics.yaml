# Фонетика min-co (опция сайта «Фонетика»). Источник правды о звучании; из него
# `python3 scripts/site/build.py` строит site/data/phonetics.json. Черновик: на слух не проверялся.
#
# Корень — токипонское слово целиком (1–3 слога), где оно подходит по смыслу; слово никогда не
# меняется, в том числе в голове слова. Значение оси — суффикс из слогов, запрещённых токипонской
# фонотактикой, поэтому он не спутается со словом: положительное — ti × |v|, отрицательное — wu × |v|,
# явный (=0) — y (ы); «не указано» — без суффикса. Слово = блоки корней через «-», затем «'» и гласная
# части речи, затем роль и метки через «·». У корней без оси суффикса нет.
value_marks:
  positive: ti
  negative: wu
  zero: y
# Метки формы: гласная + согласный; тройки [положительная, отрицательная, нейтральная]:
# [at, ad, an]: знак метки — звонкость конечного согласного, нейтральная — сонорный.
coda_families:
  - [t, d, n]
  - [k, g, m]
  - [s, z, r]
