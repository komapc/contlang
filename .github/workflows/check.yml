name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      # сгенерированные файлы совпадают с roots.yaml
      - run: python scripts/mincode/gen.py --check
      - run: python scripts/site/build.py --check
      - run: python -m pytest -q tests
