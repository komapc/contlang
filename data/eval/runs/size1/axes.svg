<text x="16.0" y="52.0" fill="#52514e" text-anchor="start" font-size="13" font-weight="normal">A reader who knows only the X roots sees a min-co code for a word and names the word; share named right (judges),</text>
<text x="16.0" y="70.0" fill="#52514e" text-anchor="start" font-size="13" font-weight="normal">weighted by how often words occur in English texts. Each word is one code of up to 3 min-co words.</text>
