<text x="16.0" y="538.0" fill="#52514e" text-anchor="start" font-size="10.5" font-weight="normal">PCA lines: a word is written as r values (-5..+5) on r of X automatic meaning axes (PCA of word vectors); its reader knows the exact</text>
