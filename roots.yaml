limits:
  max_roots: 3
  extra_root: ABSTRACT
pos:
- name: o
  what: имя
- name: i
  what: глагол
- name: a
  what: признак
- name: e
  what: обстоятельство
labels:
- name: T
  what: 'время: опорная точка относительно «сейчас»'
  scale: −5 давно … 0 сейчас … +5 когда-нибудь (`T-2` прошлое, `T+2` будущее)
  range:
  - -5
  - 5
- name: R
  what: время события относительно опорной точки
  scale: −3 раньше … 0 одновременно … +3 позже
  range:
  - -3
  - 3
- name: N
  what: число
  scale: 0 нет … +5 все (`N+3` несколько)
  range:
  - 0
  - 5
- name: M
  what: отрицание, вероятность
  scale: −5 не … −3 может быть … +4 наверняка
  range:
  - -5
  - 4
- name: A
  what: вид
  scale: −5 вот-вот начнётся … 0 идёт … +5 закончено
  range:
  - -5
  - 5
- name: C
  what: сравнение
  scale: −3 меньше, +3 больше, +5 самый
  range:
  - -3
  - 5
- name: I
  what: интенсивность
  scale: −5 едва … −2 слегка … +2 довольно … +5 чрезвычайно (`I+4` очень; `I0` не писать)
  range:
  - -5
  - 5
- name: D
  what: определённость
  scale: −3 *a*, +3 *the*
  range:
  - -3
  - 3
- name: V
  what: залог
  scale: −4 претерпевает, 0 само собой, +4 намеренно
  range:
  - -4
  - 4
- name: K
  what: побуждение (каузатив)
  scale: −5 помешать, отговорить … 0 допустить … +5 заставить, вызвать
  range:
  - -5
  - 5
- name: '!'
  what: приказ
  scale: без значения
  bare: true
- name: '?'
  what: вопрос
  scale: без значения
  bare: true
particles:
- name: E
  role: дополнение
- name: PI
  role: существительное-определение
- name: LA
  role: условие, контекст, опорная точка для `R`
- name: PE
  role: деятель при `V-4` («кем»)
- name: AND
  role: 'сочинение: и, также'
- name: LI
  role: 'сказуемое (решено: остаётся отдельным словом)'
- name: '[ ]'
  role: клауза
- name: ;
  role: граница независимых клауз длинного предложения (у каждого слова своя форма `| …`)
- name: '"…"'
  role: имена, числа, даты, латынь
roots:
- name: GOOD
  axis:
    neg: плохо
    mid: ''
    pos: хорошо
  one_sided: false
  ru_axis: плохо … хорошо
  status: принято
  en_axis: -5 terrible ... +5 excellent
  semaxis:
  - good excellent great wonderful fine
  - bad terrible awful horrible poor
- name: BIG
  axis:
    neg: мало
    mid: ''
    pos: много
  one_sided: false
  ru_axis: мало … много
  status: принято
  en_axis: -5 tiny ... +5 huge (size, degree, intensity)
  semaxis:
  - big large huge enormous vast
  - small tiny little minor miniature
- name: NEAR
  axis:
    neg: далеко
    mid: ''
    pos: близко (этот / тот)
  one_sided: false
  ru_axis: далеко … близко (в том числе «этот / тот»)
  status: принято
  en_axis: -5 far ... +5 near/here
  semaxis:
  - near close here nearby adjacent
  - far distant remote away faraway
- name: ABOVE
  axis:
    neg: ниже
    mid: ''
    pos: выше
  one_sided: false
  ru_axis: ниже … выше
  status: принято
  en_axis: -5 below/down ... +5 above/up
  semaxis:
  - above up high over upward
  - below down low under downward
- name: LIVE
  axis:
    neg: мёртвое
    mid: ''
    pos: живое
  one_sided: false
  ru_axis: мёртвое … живое
  status: принято
  en_axis: -5 dead ... +5 alive (-2 = asleep/barely alive)
  semaxis:
  - alive living lively vital animate
  - dead death lifeless dying deceased
- name: SAME
  axis:
    neg: другое
    mid: ''
    pos: то же
  one_sided: false
  ru_axis: другое … то же
  status: принято
  en_axis: -5 different/opposite ... +5 identical/exactly
  semaxis:
  - same identical equal similar alike
  - different opposite unlike distinct dissimilar
- name: TIME
  axis:
    neg: давно
    mid: сейчас
    pos: когда-нибудь
  one_sided: false
  ru_axis: раньше … позже
  status: принято
  en_axis: -5 long ago ... 0 now ... +5 someday (-1 just now, +1 soon)
  semaxis:
  - future later soon tomorrow upcoming
  - past ago earlier yesterday former
- name: INSIDE
  axis:
    neg: снаружи
    mid: ''
    pos: внутри
  one_sided: false
  ru_axis: снаружи … внутри
  status: 'принято (данные: полюса в одной семье)'
  en_axis: -5 outside ... +5 inside/innermost
  semaxis:
  - inside within interior internal indoors
  - outside external exterior outer outdoors
- name: PART
  axis:
    neg: крошка (−2 часть, член)
    mid: +2 целое, «полностью»
    pos: '+5 группа, набор (после слова: собрание таких вещей, *-aro*)'
  one_sided: false
  ru_axis: 'лестница: частица … часть … целое … группа (−5 крошка, −2 часть / член, +2 целое / «полностью», +5 группа, набор, союз); после главного слова `PART(=+5)` — собрание таких вещей, как *-aro* в эсперанто: `SOMEONE PART(=+5) \| o` общество, `THING(=0) PART(=+5) \| o` стадо / роща; `SOMEONE PART(=-2) \| o` член'
  status: принято, слепой тест 10 из 10 (`data/translation_test/roundtrip_part_ladder.md`)
  en_axis: -5 particle/crumb ... -2 a part/piece/member-of ... +2 the whole/complete (also 'entirely') ... +5 a group/collection made of many wholes (a set, union); after a head noun, PART(=+5) means a collection of those things
  semaxis:
  - group set collection bunch cluster assortment
  - crumb fragment piece bit particle speck
- name: SIDE
  axis:
    neg: зад
    mid: ''
    pos: перёд
  one_sided: false
  ru_axis: зад … перёд
  status: принято
  en_axis: -5 back ... +5 front
  semaxis:
  - front forward ahead fore frontal
  - back rear behind backward posterior
- name: KNOW
  axis:
    neg: не знаю
    mid: ''
    pos: знаю
  one_sided: false
  ru_axis: не знаю … знаю
  status: принято
  en_axis: -5 ignorant ... +5 sure/knowing
  semaxis:
  - know knowing aware informed knowledgeable
  - ignorant unaware unknown clueless uninformed
- name: WANT
  axis:
    neg: ненависть
    mid: ''
    pos: любовь
  one_sided: false
  ru_axis: не хочу … хочу (ненависть … любовь)
  status: принято
  en_axis: -5 hate/refuse ... +5 love/crave
  semaxis:
  - love desire want crave adore
  - hate loathe refuse reject detest
- name: HEAT
  axis:
    neg: лёд
    mid: тепло
    pos: огонь
  one_sided: false
  ru_axis: холодно … жарко (−5 лёд, 0 тепло/комнатная, +5 огонь)
  status: '**новое**, принято'
  en_axis: -5 ice cold ... 0 lukewarm ... +5 fire hot
  semaxis:
  - hot fire burning warm scorching
  - cold ice freezing cool frosty
- name: BEGIN
  axis:
    neg: начать
    mid: идёт
    pos: закончить
  one_sided: false
  ru_axis: 'начало … конец (−5 начать, 0 идёт / середина, +5 закончить): `BEGIN(=-5) \| i` начинать, `BEGIN(=+5) \| i` заканчивать, `BEGIN(=-4) \| a` первый, `BEGIN(=+4) \| a` последний'
  status: '**новое**, принято'
  en_axis: -5 start/begin ... 0 ongoing/middle ... +5 finish/end (-4 first, +4 last)
  semaxis:
  - end finish final last conclude
  - begin start first initial commence
- name: GIVE
  axis:
    neg: взять
    mid: обмен
    pos: отдать
  one_sided: false
  ru_axis: 'взять … отдать (−5 взять / украсть, 0 обмен, +5 отдать / подарить): `GIVE(=-5) \| i` брать, `GIVE(=+5) \| i` давать, `GIVE(=-5) GOOD(=-4) \| i` красть, `GIVE(=-3) TIME(=+3) \| i` брать взаймы'
  status: '**новое**, принято (MOVE + INSIDE не работает, `data/translation_test/roundtrip_200.md`)'
  en_axis: -5 take/steal ... 0 exchange ... +5 give/donate
  semaxis:
  - give donate present offer grant
  - take steal seize grab snatch
- name: TOUCH
  axis:
    neg: мягкое
    mid: обычное
    pos: твёрдое
  one_sided: false
  ru_axis: 'мягкое … твёрдое (−5 мягкое / нежное, 0 обычное, +5 твёрдое / острое): `TOUCH(=-4) \| a` мягкий, `TOUCH(=+5) \| a` твёрдый'
  status: '**новое**, принято (тест: sharp, concrete, board перепутаны без оси)'
  en_axis: -5 soft/gentle ... 0 ordinary ... +5 hard/sharp
  semaxis:
  - hard rigid stiff firm rough sharp
  - soft squishy fluffy spongy mushy pliable supple
- name: MATTER
  axis:
    neg: твёрдое
    mid: жидкое
    pos: газ
  one_sided: false
  ru_axis: 'твёрдое … жидкое … газ (−5 твёрдое, 0 жидкое, +5 газ): `MATTER(=0) \| o` жидкость, `MATTER(=+5) \| o` газ'
  status: '**новое**, принято (анализ ниже: классы разделены в четыре σ)'
  en_axis: -5 solid ... 0 liquid ... +5 gas
  semaxis:
  - gas vapor air steam smoke
  - solid rock stone metal brick
- name: SEX
  axis:
    neg: женское
    mid: ''
    pos: мужское
  one_sided: false
  ru_axis: женское … мужское
  status: '**новое**, предложено'
  en_axis: -5 female ... +5 male
  semaxis:
  - brother son father husband uncle
  - sister daughter mother wife aunt
- name: HAPPEN
  axis:
    neg: причина
    mid: событие
    pos: результат
  one_sided: false
  ru_axis: 'причина … следствие (−5 первопричина, 0 просто событие, +5 результат): `HAPPEN(=+4) \| o` следствие, `HAPPEN(=-4) \| o` причина, `HAPPEN(=+4) \| e` следовательно, `HAPPEN(=-4) \| e` потому что'
  status: '**новое**, принято (слепой тест: 6 из 6)'
  en_axis: -5 cause/origin ... 0 plain event ... +5 consequence/result (position in a chain of events)
  semaxis:
  - result consequence effect outcome aftermath
  - cause reason origin source root
- name: THINK
  axis:
    neg: сомневаться
    mid: думать
    pos: решить
  one_sided: false
  ru_axis: idea, thing
  status: think, suppose
  en_axis: -5 doubt/hesitate ... 0 think ... +5 decide/conclude
  semaxis:
  - decide conclude choose determine resolve
  - doubt hesitate wonder uncertain ponder
- name: CAN
  axis:
    neg: невозможно (−3 трудно)
    mid: ''
    pos: легко
  one_sided: false
  ru_axis: не могу … могу (−5 невозможно, −3 трудно, +4 легко); из NSM, нужен для «трудно / возможно»
  status: '**новое**, принято (BECAUSE отвергнут)'
  en_axis: -5 impossible ... +5 can/easily (-3 hard)
  semaxis:
  - able easy possible capable feasible
  - unable difficult incapable impossible hard
- name: MANY
  axis:
    neg: '*односторонняя 0 … +5*'
    mid: 0 ни одного
    pos: +5 все (+3 многие)
  one_sided: true
  ru_axis: '**односторонняя** 0 … +5: ни одного … единицы … многие … все'
  status: '**новое**, пробуем; «один» и точные числа — числа из послаблений'
  en_axis: one-sided 0 none ... +5 all (+4 most, +3 many, +1 few)
  semaxis:
  - all every everyone everything always
  - none nothing nobody zero never
- name: SOMEONE
  axis:
    neg: они / другой
    mid: кто-то
    pos: я (+3 ты)
  one_sided: false
  ru_axis: 'лицо (−5 они / другой, 0 кто-то, +3 ты, +5 я): `SOMEONE(=+5) \| o` я, `SOMEONE(=+3) \| o` ты, `SOMEONE(=-3) \| o` он; множественное — `MANY` вторым корнем: `SOMEONE(=+5) MANY(=+3) \| o` мы'
  status: '**новое**, принято (слепой тест: 8 из 8 местоимений)'
  en_axis: -5 they/other ... 0 someone ... +3 you ... +5 I/me
  semaxis:
  - i me my myself mine
  - they them their others themselves
- name: THING
  axis:
    neg: камень
    mid: растение
    pos: животное (+4)
  one_sided: false
  ru_axis: 'одушевлённость (−5 камень … 0 растение … +4 животное; человек — SOMEONE): `THING(=-5) \| o` камень, `THING(=+4) BIG(=+5) \| o` слон'
  status: '**новое**, принято (тест: камень, насекомое, животное, слон верно; растения слабо)'
  en_axis: -5 inanimate/stone ... 0 plant ... +4 animal
  semaxis:
  - animal dog cat horse cow
  - stone pebble boulder mineral gravel
- name: MOVE
  axis:
    neg: стоять
    mid: идти
    pos: мчаться
  one_sided: false
  ru_axis: movement, motion
  status: move, shift
  en_axis: -5 stand still ... 0 walk ... +5 sprint/very fast
  semaxis:
  - run sprint fast rush hurry
  - stand still stop rest motionless
- name: FEEL
  axis:
    neg: вялость
    mid: ''
    pos: сильное чувство
  one_sided: false
  ru_axis: 'спокойно … возбуждённо (−5 вялость, +5 сильное чувство; приятно или нет — GOOD): `FEEL(=+4) GOOD(=-4) \| a` злой'
  status: '**новое**, принято (тест: 6 из 8; «злой» и «испуганный» путаются)'
  en_axis: -5 calm/low-energy ... +5 excited/intense (pleasant or not is GOOD)
  semaxis:
  - excited intense passionate thrilled frantic
  - calm sluggish bored quiet sleepy
- name: RULE
  axis:
    neg: личное, неформальное
    mid: обычное
    pos: официальное, учреждение, закон
  one_sided: false
  ru_axis: 'личное … официальное (−5 личное, неформальное, частное; 0 обычное; +5 официальное, учреждение, закон): `RULE(=+4) \| o` власть, учреждение, `SOMEONE PART(=+5) RULE(=+4) \| o` комитет, ведомство'
  status: '**новое**, предложено (SemAxis: комитет +0,53, комиссия, ведомство; оси почти не пересекается с другими,'
  en_axis: -5 personal/private/informal ... 0 ordinary ... +5 official/institutional/law (RULE(=+4) = authority, an institution)
  semaxis:
  - authority committee agency commission government
  - individual private personal informal citizen
  en_gloss: law, rule, govern
- name: CHANGE
  axis:
    neg: остаться
    mid: меняться
    pos: превратить, измениться полностью
  one_sided: false
  ru_axis: 'остаться … измениться (−5 остаться, не меняться, 0 меняться, +5 превратить, измениться полностью): `CHANGE \| i` менять, `CHANGE(=-4) \| i` оставаться, `CHANGE BIG(=+3) \| i` расти, `CHANGE GOOD(=+3) \| i` улучшать'
  status: '**новое**, предложено (SemAxis: alter, transform, modify, shift; направление увеличить/уменьшить даётся осями `BIG` и `GOOD`)'
  en_axis: '-5 stay/remain/not change ... 0 change ... +5 transform completely (direction of change comes from other roots: CHANGE BIG(=+3) = grow, CHANGE GOOD(=+3) = improve)'
  semaxis:
  - change transform alter vary shift
  - remain stay constant stable unchanged
  en_gloss: change, become different
- name: PARTICULAR
  axis:
    neg: общее, универсальное
    mid: обычное
    pos: особое, единственное, конкретное
  one_sided: false
  ru_axis: 'общее … особое (−5 общее, универсальное, 0 обычное, +5 особое, единственное, конкретное): `PARTICULAR(=+4) \| a` особый, конкретный, `PARTICULAR(=-4) \| a` общий'
  status: '**новое**, предложено, проверить слепым тестом (SemAxis: unique, peculiar, particular, specific)'
  en_axis: -5 general/universal ... 0 ordinary ... +5 particular/unique/specific
  semaxis:
  - particular specific unique peculiar distinct
  - general common universal generic typical
  en_gloss: particular, specific, special
- name: ART
  axis:
    neg: расчёт, техника, точные науки
    mid: смешанное
    pos: творчество, культура, гуманитарное
  one_sided: false
  ru_axis: 'техника … творчество (−5 расчёт, техника, устройства, точные науки, 0 смешанное, +5 творчество, культура, гуманитарное): `ART(=-4) KNOW \| o` физика, `ART(=+5) SAY \| o` поэзия, `ART(=-5) SOMEONE \| o` инженер; корень без значения — умение, ремесло, дисциплина'
  status: '**новое**, предложено (SemAxis: полюса «гуманитарное + искусство» против «точные науки + техника», LOO 1.00, оси покрывают 10 %); принято (слепой тест: 29 из 32, мимо только *architecture*)'
  en_axis: -5 calculation/technology/devices/exact science ... 0 mixed ... +5 creativity/culture/humanities/arts. The bare root means skill, craft, discipline.
  semaxis:
  - art painting music poetry sculpture beauty literature philosophy
  - technology machine engineering device mechanical electronics mathematics physics
  en_gloss: skill, craft, discipline
- name: JOIN
  axis:
    neg: отделить, убрать
    mid: состав не меняется
    pos: присоединить, добавить, объединить
  one_sided: false
  ru_axis: 'отделить … присоединить (−5 отделить, убрать, уйти, вычесть, 0 состав не меняется, +5 присоединить, добавить, привнести, объединить): `JOIN(=+4) \| i` присоединять, `JOIN(=-4) \| i` убирать'
  status: '**новое**, предложено (SemAxis: полюса join/add/attach против separate/remove/detach, LOO 1.00; ближайшие оси GIVE +0.3, NEAR +0.2); принято с оговоркой (слепой тест: ~8 из 10; *add* не читается, внутри кластера слова сливаются)'
  en_axis: -5 separate/remove/subtract ... 0 composition unchanged ... +5 join/add/attach/unite.
  semaxis:
  - join add attach connect combine unite
  - separate remove detach disconnect divide subtract
  en_gloss: join, add, attach, separate
- name: VALUE
  axis:
    neg: дёшево, бесполезно
    mid: обычная цена
    pos: дорого, ценно
  one_sided: false
  ru_axis: 'дёшево … дорого (−5 дёшево, бесполезно, ничего не стоит, 0 обычная цена, +5 дорого, ценно, драгоценно): `VALUE(=+4) \| a` дорогой, ценный, `VALUE(=-4) \| a` дешёвый; покупка и продажа — вместе с `GIVE`'
  status: '**новое**, предложено (SemAxis: полюса cheap/worthless/useless против expensive/valuable/precious, LOO 0.91); принято (слепой тест: 10 из 10 на прилагательных; *buy/sell* путаются по знаку `GIVE`)'
  en_axis: -5 cheap/worthless ... 0 ordinary price ... +5 expensive/valuable/precious.
  semaxis:
  - expensive valuable precious costly priceless
  - cheap inexpensive worthless bargain trivial
  en_gloss: price, worth
- name: CARE
  axis:
    neg: небрежно, наспех
    mid: обычно
    pos: тщательно, осторожно
  one_sided: false
  ru_axis: 'небрежно … тщательно (−5 небрежно, наспех, 0 обычно, +5 тщательно, осторожно, методично): `CARE(=+4) \| e` тщательно, `CARE(=-4) \| e` небрежно, наспех'
  status: '**новое**, предложено (SemAxis: carefully/meticulously против carelessly/hastily, LOO 0.92); принято (слепой тест: 6 из 6, 12 из 12 с осью на `DO`)'
  en_axis: -5 careless/hasty ... 0 ordinary ... +5 careful/thorough/meticulous.
  semaxis:
  - carefully thoughtfully meticulously methodically cautiously accurately
  - carelessly casually sloppily hastily recklessly roughly
  en_gloss: care, attention, diligence
- name: TONE
  axis:
    neg: грубо, холодно, враждебно
    mid: нейтрально
    pos: вежливо, тепло, дружелюбно
  one_sided: false
  ru_axis: 'грубо … вежливо (−5 грубо, холодно, враждебно, резко, 0 нейтрально, +5 вежливо, тепло, дружелюбно, искренне): `TONE(=+4) \| a` вежливый, `TONE(=-4) \| a` грубый, `TONE(=+4) \| e` вежливо'
  status: '**новое**, предложено (SemAxis: polite/kind/warm против rude/harsh/cold, LOO 1.00; ближайшие оси TOUCH −0.4, GOOD +0.3); принято (слепой тест: 26 из 32, ещё 5 рядом; *kind / courteous / tactful* сливаются)'
  en_axis: -5 rude/cold/hostile/harsh ... 0 neutral ... +5 polite/warm/friendly/sincere.
  semaxis:
  - politely kindly gently sincerely warmly gratefully
  - rudely harshly coldly angrily bitterly bluntly
  en_gloss: tone, manner toward others
- name: CONSUME
  axis:
    neg: выделить (писать, говорить, испражняться)
    mid: обмен
    pos: поглотить (есть, читать, слушать)
  one_sided: false
  ru_axis: 'выделить … поглотить (−5 выделить, выбросить, излить, 0 обмен, +5 поглотить, принять внутрь: есть, пить, читать, слушать; −5 выделять: испражняться, писать, говорить, излучать): `CONSUME(=+4) \| i` поглощать, есть, `CONSUME(=-4) \| i` выделять; канал задаёт второй корень: `CONSUME(=+4) SEE \| i` читать, `CONSUME(=-4) SAY \| i` говорить'
  status: '**новое**, предложено пользователем (приём ↔ выдача: есть / испражняться, читать / писать, слушать / говорить); принято (слепой тест: 26 из 32; еда, дыхание, речь читаются, *read / write* нет)'
  en_axis: -5 emit/output (excrete, write, speak, spit, exhale) ... 0 exchange ... +5 take in/intake (eat, drink, read, listen, inhale). The channel or object is given by a second root, e.g. SEE, SAY, BODY.
