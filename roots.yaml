  ru_axis: 'величина сама по себе … относительно другой (−5 величина как есть: размер, количество, длина, число, 0 уровень, степень, +5 величина относительно другой: отношение, доля, пропорция, процент, скорость-как-отношение, среднее): `MEASURE(=-5) \| o` количество, размер, `MEASURE(=+5) \| o` отношение, `MEASURE \| i` измерять, единица — `MEASURE SAME \| o`'
  status: '**новое**, введено по правилу (*ratio / proportion / measurement* дважды не читались через `PART`, `BIG`, `SAME`, `SEE`); первая версия оси (единица … количество … отношение) была смесью трёх понятий, переписана; ось независима (SemAxis, максимум косинуса с BIG −0,18); слепой тест v2 26 из 32 — см. [roundtrip_measure](../data/translation_test/roundtrip_measure.md)'
  en_axis: '-5 a magnitude in itself (size, amount, length, weight, number) ... 0 level, degree, extent ... +5 a magnitude relative to another (ratio, rate, proportion, percentage, average). Measuring as an action: `MEASURE | i` (to measure); a unit is a magnitude used as a standard (`MEASURE SAME`). As an adjective: measurable / proportional.'
