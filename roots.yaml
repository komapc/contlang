limits:
  max_roots: 3  # без исключений (v2: ABSTRACT сверх лимита и четыре корня у сторон света убраны)
pos:
- name: o
  what: имя
- name: i
  what: глагол
- name: a
  what: признак
- name: e
  what: обстоятельство
roles:  # роль имени после `| o` (как эсперантские -ist, -il, -aĵ, -ec), без значения; v2, data/eval/runs/toki
- name: agent
  what: 'тот, кто это делает (человек или вещь): `TEXT | o agent` писатель, `HAPPEN | o agent` причина'
  en_what: 'the one who does it (person or thing): `TEXT | o agent` writer, `HAPPEN | o agent` cause'
- name: tool
  what: 'орудие, средство: `TEXT | o tool` ручка, `JOIN(=-4) TOUCH(=+4) | o tool` нож'
  en_what: 'the means or instrument: `TEXT | o tool` pen, `JOIN(=-4) TOUCH(=+4) | o tool` knife'
- name: result
  what: 'то, что получается: `HAPPEN | o result` следствие'
  en_what: 'what comes out of it: `HAPPEN | o result` consequence'
- name: quality
  what: 'само качество или состояние: `GOOD | o quality` доброта, `CAN | o quality` способность'
  en_what: 'the quality or state itself: `GOOD | o quality` goodness, `CAN | o quality` ability'
labels:
- name: T
  what: 'время: опорная точка относительно «сейчас»'
  scale: −5 давно … 0 сейчас … +5 когда-нибудь (`T-2` прошлое, `T+2` будущее)
  en_what: 'tense: reference time relative to now'
  en_scale: '−5 long ago … 0 now … +5 someday (`T-2` past, `T+2` future)'
  range:
  - -5
  - 5
- name: R
  what: время события относительно опорной точки
  scale: −3 раньше … 0 одновременно … +3 позже
  en_what: 'time of the event relative to the reference point'
  en_scale: '−3 before … 0 at the same time … +3 after'
  range:
  - -3
  - 3
- name: N
  what: число
  scale: 0 нет … +5 все (`N+3` несколько)
  en_what: 'number (on a verb: number of the subject)'
  en_scale: '0 none … +5 all (`N+3` several)'
  range:
  - 0
  - 5
- name: M
  what: отрицание, вероятность
  scale: −5 не … −3 может быть … +4 наверняка
  en_what: 'negation, probability'
  en_scale: '−5 not … −3 maybe … +4 surely'
  range:
  - -5
  - 4
- name: A
  what: вид
  scale: −5 вот-вот начнётся … 0 идёт … +5 закончено
  en_what: 'aspect'
  en_scale: '−5 about to start … 0 ongoing … +5 finished'
  range:
  - -5
  - 5
- name: C
  what: сравнение
  scale: −3 меньше, +3 больше, +5 самый
  en_what: 'comparison'
  en_scale: '−3 less, +3 more, +5 most'
  range:
  - -3
  - 5
- name: I
  what: интенсивность
  scale: −5 едва … −2 слегка … +2 довольно … +5 чрезвычайно (`I+4` очень; `I0` не писать)
  en_what: 'intensity'
  en_scale: '−5 barely … −2 slightly … +2 fairly … +5 extremely (`I+4` very; do not write `I0`)'
  range:
  - -5
  - 5
- name: D
  what: определённость
  scale: −3 *a*, +3 *the*
  en_what: 'definiteness'
  en_scale: '−3 *a*, +3 *the*'
  range:
  - -3
  - 3
- name: V
  what: залог
  scale: −4 претерпевает, 0 само собой, +4 намеренно
  en_what: 'voice'
  en_scale: '−4 undergoes (passive), 0 happens by itself, +4 on purpose'
  range:
  - -4
  - 4
- name: K
  what: побуждение (каузатив)
  scale: −5 помешать, отговорить … 0 допустить … +5 заставить, вызвать
  en_what: 'causation'
  en_scale: '−5 prevent, dissuade … 0 allow … +5 make, cause'
  range:
  - -5
  - 5
- name: '!'
  what: приказ
  scale: без значения
  en_what: 'command'
  en_scale: 'no value'
  bare: true
- name: '?'
  what: вопрос
  scale: без значения
  en_what: 'question'
  en_scale: 'no value'
  bare: true
particles:
- name: E
  role: дополнение
  en_role: 'direct object'
- name: FROM
  role: 'связка существительных: X FROM Y — X сделан из Y (материал, источник); первым проверяется он'
  en_role: 'noun link: X FROM Y = X is made of Y (material, source); checked first'
- name: FOR
  role: 'связка: X FOR Y — X сделан для Y (им пользуются с Y, на Y или Y); вторым'
  en_role: 'noun link: X FOR Y = X is made for Y (used with, on or by Y); checked second'
- name: LIKE
  role: 'связка: X LIKE Y — X похож на Y, но не Y; третьим'
  en_role: 'noun link: X LIKE Y = X looks like Y but is not Y; checked third'
- name: PI
  role: 'связка: X PI Y — всё прочее: X часть Y или находится, живёт в Y; последним'
  en_role: 'noun link: X PI Y = anything else: X is a part of Y, or is found or lives in Y; checked last'
- name: LA
  role: условие, контекст, опорная точка для `R`
  en_role: 'condition, context, reference point for `R`'
- name: PE
  role: деятель при `V-4` («кем»)
  en_role: 'agent of a passive `V-4` (“by whom”)'
- name: AND
  role: 'сочинение: и, также'
  en_role: 'coordination: and, also'
- name: LI
  role: 'сказуемое (решено: остаётся отдельным словом)'
  en_role: 'predicate marker'
- name: '[ ]'
  role: клауза
  en_role: 'clause'
- name: ;
  role: граница независимых клауз длинного предложения (у каждого слова своя форма `| …`)
  en_role: 'boundary of independent clauses in a long sentence (every word keeps its own form `| …`)'
- name: '"…"'
  role: имена, числа, даты, латынь
  en_role: 'names, numbers, dates, Latin'
roots:
- name: GOOD
  axis:
    neg: плохо
    mid: ''
    pos: хорошо
  ru_axis: плохо … хорошо
  status: принято
  en_axis: '-5 terrible … +5 excellent'
  semaxis:
  - good excellent great wonderful fine
  - bad terrible awful horrible poor
- name: BIG
  axis:
    neg: мало
    mid: ''
    pos: много
  ru_axis: мало … много
  status: принято
  en_axis: '-5 tiny … +5 huge (size only)'
  semaxis:
  - big large huge enormous vast
  - small tiny little minor miniature
- name: NEAR
  axis:
    neg: далеко
    mid: ''
    pos: близко (этот / тот)
  ru_axis: далеко … близко (в том числе «этот / тот»)
  status: принято
  en_axis: '-5 far … +5 here'
  semaxis:
  - near close here nearby adjacent
  - far distant remote away faraway
- name: ABOVE
  axis:
    neg: ниже
    mid: ''
    pos: выше
  ru_axis: ниже … выше
  status: принято
  en_axis: '-5 below, down … +5 above, up'
  semaxis:
  - above up high over upward
  - below down low under downward
- name: LIVE
  axis:
    neg: мёртвое
    mid: ''
    pos: живое
  ru_axis: мёртвое … живое
  status: принято
  en_axis: '-5 dead … -2 asleep … +5 alive'
  semaxis:
  - alive living lively vital animate
  - dead death lifeless dying deceased
- name: SAME
  axis:
    neg: другое, особое
    mid: ''
    pos: то же, общее
  ru_axis: 'другое … то же (−5 другое, противоположное, −4 особое, не как другие, +3 обычное, +5 то же, тождественное): `SAME(=-4) \| a` особый, уникальный, `SAME(=-4) \| e` особенно, `SAME(=+3) \| a` обычный, `SAME(=+4) MANY(=+5) \| a` общий, всеобщий, `SAME(=-4) JOIN(=-5) RULE \| o` исключение'
  status: 'принято; **с 2026-10 вбирает корень PARTICULAR** (общее … особое): слепой тест 12 слов × 2 кодировщика — с PARTICULAR 13 точных из 24, через SAME 12 из 24 — [roundtrip_merge](../data/translation_test/roundtrip_merge.md)'
  en_axis: '-5 opposite, different … -4 special … +3 ordinary … +5 identical'
  semaxis:
  - same identical equal similar alike
  - different opposite unlike distinct dissimilar
- name: TIME
  axis:
    neg: давно
    mid: сейчас
    pos: когда-нибудь
  ru_axis: раньше … позже
  status: принято
  en_axis: '-5 long ago … 0 now … +5 far future (-1 just now, +1 soon)'
  semaxis:
  - future later soon tomorrow upcoming
  - past ago earlier yesterday former
- name: INSIDE
  axis:
    neg: снаружи
    mid: на границе
    pos: внутри
  ru_axis: 'снаружи … на границе, на краю, поверхность … внутри'
  status: 'принято (данные: полюса в одной семье); середина `INSIDE(=0)` — граница, край, поверхность (слепой тест 22 кода: 32 → 53 % «близко», [inside0](../data/eval/runs/inside0/README.md))'
  en_axis: '-5 outside … 0 on the border, at the edge, the surface … +5 inside'
  semaxis:
  - inside within interior internal indoors
  - outside external exterior outer outdoors
- name: PART
  axis:
    neg: крошка (−2 часть, член)
    mid: +2 целое, «полностью»
    pos: '+5 группа, набор (после слова: собрание таких вещей, *-aro*)'
  ru_axis: 'лестница: частица … часть … целое … группа (−5 крошка, −2 часть / член, +2 целое / «полностью», +5 группа, набор, союз); после главного слова `PART(=+5)` — собрание таких вещей, как *-aro* в эсперанто: `SOMEONE PART(=+5) \| o` общество, `THING(=0) PART(=+5) \| o` стадо / роща; `SOMEONE PART(=-2) \| o` член'
  status: принято, слепой тест 10 из 10 (`data/translation_test/roundtrip_part_ladder.md`)
  en_axis: '-5 particle, crumb … -2 a part, member … +2 the whole … +5 a group of many'
  semaxis:
  - group set collection bunch cluster assortment
  - crumb fragment piece bit particle speck
- name: SIDE
  axis:
    neg: зад
    mid: ''
    pos: перёд
  ru_axis: зад … перёд
  status: принято
  en_axis: '-5 back … +5 front'
  semaxis:
  - front forward ahead fore frontal
  - back rear behind backward posterior
- name: KNOW
  axis:
    neg: не знаю
    mid: ''
    pos: знаю
  ru_axis: не знаю … знаю
  status: принято
  en_axis: '-5 ignorant … +5 sure'
  semaxis:
  - know knowing aware informed knowledgeable
  - ignorant unaware unknown clueless uninformed
- name: WANT
  axis:
    neg: ненависть
    mid: ''
    pos: любовь
  ru_axis: не хочу … хочу (ненависть … любовь)
  status: принято
  en_axis: '-5 hate, refuse … +5 love, crave'
  semaxis:
  - love desire want crave adore
  - hate loathe refuse reject detest
- name: HEAT
  axis:
    neg: лёд
    mid: тепло
    pos: огонь
  ru_axis: холодно … жарко (−5 лёд, 0 тепло/комнатная, +5 огонь)
  status: '**новое**, принято'
  en_axis: '-5 ice cold … +5 fire hot'
  semaxis:
  - hot fire burning warm scorching
  - cold ice freezing cool frosty
- name: BEGIN
  axis:
    neg: начать
    mid: идёт
    pos: закончить
  ru_axis: 'начало … конец (−5 начать, 0 идёт / середина, +5 закончить): `BEGIN(=-5) \| i` начинать, `BEGIN(=+5) \| i` заканчивать, `BEGIN(=-4) \| a` первый, `BEGIN(=+4) \| a` последний'
  status: '**новое**, принято'
  en_axis: '-5 start … 0 ongoing … +5 end'
  semaxis:
  - end finish final last conclude
  - begin start first initial commence
- name: GIVE
  axis:
    neg: взять
    mid: обмен
    pos: отдать
  ru_axis: 'взять … отдать (−5 взять / украсть, 0 обмен, +5 отдать / подарить): `GIVE(=-5) \| i` брать, `GIVE(=+5) \| i` давать, `GIVE(=-5) GOOD(=-4) \| i` красть, `GIVE(=-3) TIME(=+3) \| i` брать взаймы'
  status: '**новое**, принято (MOVE + INSIDE не работает, `data/translation_test/roundtrip_200.md`)'
  en_axis: '-5 take … 0 exchange … +5 give'
  semaxis:
  - give donate present offer grant
  - take steal seize grab snatch
- name: TOUCH
  axis:
    neg: мягкое
    mid: обычное
    pos: твёрдое
  ru_axis: 'мягкое … твёрдое (−5 мягкое / нежное, 0 обычное, +5 твёрдое / острое): `TOUCH(=-4) \| a` мягкий, `TOUCH(=+5) \| a` твёрдый'
  status: '**новое**, принято (тест: sharp, concrete, board перепутаны без оси)'
  en_axis: '-5 soft … +5 hard, sharp'
  semaxis:
  - hard rigid stiff firm rough sharp
  - soft squishy fluffy spongy mushy pliable supple
- name: SEX
  axis:
    neg: женское
    mid: ''
    pos: мужское
  ru_axis: 'женское … мужское (только у слов с явным полом: −5 женщина, +5 мужчина; слабые ±1, ±2 не ставятся)'
  status: '**новое**, предложено'
  en_axis: '-5 female … +5 male (only for words of explicit sex)'
  semaxis:
  - brother son father husband uncle
  - sister daughter mother wife aunt
- name: HAPPEN
  axis: null
  ru_gloss: событие, случаться
  en_gloss: event, happen
  status: 'принято; в v2 без оси (была причина … следствие): причина — `HAPPEN | o agent`, следствие — `HAPPEN | o result`'
- name: THINK
  axis:
    neg: сомневаться
    mid: думать
    pos: решить
  ru_axis: idea, thing
  status: think, suppose
  en_axis: '-5 doubt … 0 think … +5 decide'
  semaxis:
  - decide conclude choose determine resolve
  - doubt hesitate wonder uncertain ponder
- name: CAN
  axis:
    neg: невозможно (−3 трудно)
    mid: ''
    pos: легко
  ru_axis: не могу … могу (−5 невозможно, −3 трудно, +4 легко); из NSM, нужен для «трудно / возможно»
  status: '**новое**, принято (BECAUSE отвергнут)'
  en_axis: '-5 impossible … -3 hard … +5 easy'
  semaxis:
  - able easy possible capable feasible
  - unable difficult incapable impossible hard
- name: MANY
  axis:
    neg: −5 ни одного, нет вовсе (−3 почти нет, нехватка)
    mid: 0 сколько-то
    pos: +5 все (+3 многие)
  ru_axis: 'сколько (−5 ни одного, нет вовсе, −4 нет нужного: нехватка, отсутствие, −3 почти нет, едва, −1 мало, немногие, 0 сколько-то, +3 многие, +4 большинство, +5 все, всегда): `THING MANY(=-5) \| o` ничто, `MANY(=-4) \| o` нехватка, отсутствие, `MANY(=-3) \| e` едва, почти не, `SOMEONE MANY(=+5) \| o` все'
  status: 'принято; **с 2026-10 двусторонняя** (до 2026-10 шкала была 0 … +5, «ни одного» было 0): у математики полюс none / zero / absence стоит на −5, а 0 читается как *certainly, absolutely*; кодер ставил отрицательные уровни в 46 % кодов с MANY (*lack, absence, insufficient, hardly, barely*) — [data/eval/runs/many](../data/eval/runs/many/README.md); «один» и точные числа — числа из послаблений'
  en_axis: '-5 none, never … -1 few … 0 some … +3 many … +5 all, always'
  semaxis:
  - all every everyone everything always
  - none nothing nobody zero never
- name: SOMEONE
  axis:
    neg: они / другой
    mid: кто-то
    pos: я (+3 ты)
  ru_axis: 'лицо (−5 они / другой, 0 кто-то, +3 ты, +5 я): `SOMEONE(=+5) \| o` я, `SOMEONE(=+3) \| o` ты, `SOMEONE(=-3) \| o` он; множественное — `MANY` вторым корнем: `SOMEONE(=+5) MANY(=+3) \| o` мы'
  status: '**новое**, принято (слепой тест: 8 из 8 местоимений)'
  en_axis: '-5 they, others … 0 someone … +3 you … +5 I'
  semaxis:
  - i me my myself mine
  - they them their others themselves
- name: THING
  axis:
    neg: камень
    mid: растение
    pos: животное (+4)
  ru_axis: 'одушевлённость (−5 камень … 0 растение … +4 животное; человек — SOMEONE): `THING(=-5) \| o` камень, `THING(=+4) BIG(=+5) \| o` слон'
  status: '**новое**, принято (тест: камень, насекомое, животное, слон верно; растения слабо)'
  en_axis: '-5 stone, inanimate … 0 plant … +4 animal'
  semaxis:
  - animal dog cat horse cow
  - stone pebble boulder mineral gravel
- name: MOVE
  axis:
    neg: стоять
    mid: идти
    pos: мчаться
  ru_axis: movement, motion
  status: move, shift
  en_axis: '-5 stand still … 0 walk … +5 rush'
  semaxis:
  - run sprint fast rush hurry
  - stand still stop rest motionless
- name: FEEL
  axis:
    neg: вялость
    mid: ''
    pos: сильное чувство
  ru_axis: 'спокойно … возбуждённо (−5 вялость, +5 сильное чувство; приятно или нет — GOOD): `FEEL(=+4) GOOD(=-4) \| a` злой'
  status: '**новое**, принято (тест: 6 из 8; «злой» и «испуганный» путаются)'
  en_axis: '-5 calm … +5 excited, intense (pleasant or not is GOOD)'
  semaxis:
  - excited intense passionate thrilled frantic
  - calm sluggish bored quiet sleepy
- name: RULE
  axis:
    neg: личное, неформальное
    mid: обычное
    pos: официальное, учреждение, закон
  ru_axis: 'личное … официальное (−5 личное, неформальное, частное; 0 обычное; +5 официальное, учреждение, закон): `RULE(=+4) \| o` власть, учреждение, `SOMEONE PART(=+5) RULE(=+4) \| o` комитет, ведомство'
  status: '**новое**, принято; полюса SemAxis сменены с ведомств (authority committee agency commission government) на закон и власть: прежние тянули любой код с RULE к *commissions, agencies*, институты (суд, банк, школа, выборы…) попадали в top10 в 6% случаев, теперь в 32% (data/lacunae.md)'
  en_axis: '-5 private, informal … +4 authority, institution … +5 law, official'
  semaxis:
  - law official authority formal legal govern rule
  - personal private informal individual unofficial
  en_gloss: law, rule, govern
- name: CHANGE
  axis:
    neg: остаться
    mid: меняться
    pos: превратить, измениться полностью
  ru_axis: 'остаться … измениться (−5 остаться, не меняться, 0 меняться, +5 превратить, измениться полностью): `CHANGE \| i` менять, `CHANGE(=-4) \| i` оставаться, `CHANGE BIG(=+3) \| i` расти, `CHANGE GOOD(=+3) \| i` улучшать'
  status: '**новое**, предложено (SemAxis: alter, transform, modify, shift; направление увеличить/уменьшить даётся осями `BIG` и `GOOD`)'
  en_axis: '-5 stay the same … 0 change … +5 transform (the direction comes from the next root: `CHANGE GOOD(=+3)` improve)'
  semaxis:
  - change transform alter vary shift
  - remain stay constant stable unchanged
  en_gloss: change, become different
- name: ART
  axis:
    neg: расчёт, техника, точные науки
    mid: смешанное
    pos: творчество, культура, гуманитарное
  ru_axis: 'техника … творчество (−5 расчёт, техника, устройства, точные науки, 0 смешанное, +5 творчество, культура, гуманитарное): `ART(=-4) KNOW \| o` физика, `ART(=+5) SAY \| o` поэзия, `ART(=-5) SOMEONE \| o` инженер; корень без значения — умение, ремесло, дисциплина'
  status: '**новое**, предложено (SemAxis: полюса «гуманитарное + искусство» против «точные науки + техника», LOO 1.00, оси покрывают 10 %); принято (слепой тест: 29 из 32, мимо только *architecture*)'
  en_axis: '-5 technology, exact science … +5 arts, humanities (the plain root means skill, craft)'
  semaxis:
  - art painting music poetry sculpture beauty literature philosophy
  - technology machine engineering device mechanical electronics mathematics physics
  en_gloss: skill, craft, discipline
- name: JOIN
  axis:
    neg: отделить, убрать
    mid: состав не меняется
    pos: присоединить, добавить, объединить
  ru_axis: 'отделить … присоединить (−5 отделить, убрать, уйти, вычесть, 0 состав не меняется, +5 присоединить, добавить, привнести, объединить): `JOIN(=+4) \| i` присоединять, `JOIN(=-4) \| i` убирать'
  status: '**новое**, предложено (SemAxis: полюса join/add/attach против separate/remove/detach, LOO 1.00; ближайшие оси GIVE +0.3, NEAR +0.2); принято с оговоркой (слепой тест: ~8 из 10; *add* не читается, внутри кластера слова сливаются)'
  en_axis: '-5 separate, remove … +5 join, add, attach'
  semaxis:
  - join add attach connect combine unite
  - separate remove detach disconnect divide subtract
  en_gloss: join, add, attach, separate
- name: VALUE
  axis:
    neg: дёшево, бесполезно
