  ru_axis: 'конкретное … абстрактное (−5 вещественное, физическое, осязаемое: дом, пинать, трясти, 0 смешанное, +5 отвлечённое, умственное: теория, принцип, предполагать, подразумевать): `ABSTRACT(=-4) \| o` вещь, предмет, `ABSTRACT(=+4) \| o` понятие, `ABSTRACT(=+4) THINK \| i` предполагать; конкретный / абстрактный как признак — `\| a`'
  status: '**новое**, предложено остаточным PCA по частям речи (у глаголов, существительных, прилагательных, наречий; SemAxis: idea/theory/concept/principle против house/stone/hand/door/kick, косинус с ART +0,05, максимум с остальными осями 0,16); принято (слепой тест: 25 из 32, знак не перепутан ни разу, промахи — соседи: *theory / concept, kick / hit*)'
  en_axis: '-5 concrete/physical/tangible (house, kick, shake) ... 0 mixed ... +5 abstract/mental/intangible (theory, principle, assume, imply). A noun or verb is on the physical or the mental side; as an adjective: concrete / abstract.'
